# Rebuild griddion.io every 4 hours so each day's drive is live well before midnight Eastern.
# The build only ships drives dated <= (today ET + 1), so tomorrow's drive goes up early and
# future answers never deploy. GitHub's scheduled runs can start hours late, so there is no
# time-of-day check: every run triggers the deploy hook.
name: Nightly deploy

on:
  schedule:
    - cron: '5 */4 * * *' # UTC: 00:05, 04:05, 08:05, 12:05, 16:05, 20:05
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::error::CF_PAGES_DEPLOY_HOOK secret is not set"; exit 1; fi
          curl -fsS -X POST "$HOOK"
          echo "Deploy hook triggered at $(TZ=America/New_York date)."
