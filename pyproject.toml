[project]
name = "football-trivia"
version = "0.1.0"
description = "Daily football rare-answer trivia: data pipeline"
authors = [
    { name = "Braden", email = "bradenmaresco@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=2.0.0",
    "lxml>=6.1.3",
    "nflreadpy>=0.1.5",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
]

[project.scripts]
refresh = "football_trivia.refresh:main"
probe = "football_trivia.probe:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
