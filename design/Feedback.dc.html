<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Griddion feedback popup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;family=Silkscreen:wght@400;700&amp;family=Courier+Prime:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#c8352f}a:hover{color:#8e2330}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #160f33; font-family: 'Courier Prime', monospace; color: #1d1a14">

<div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px">
<div style="height: 266px; background: #0f0b26; position: relative">
<div style="position: absolute; left: 0; top: 96px; width: 390px; height: 170px; background: #211a45"></div>
<div style="position: absolute; left: 40px; top: 12px; width: 310px; box-sizing: border-box; background: #2b2b33; border: 3px solid #0a0a10; padding: 6px; display: flex; flex-direction: column; gap: 6px">
<div style="height: 26px; background: #c8352f"></div>
<div style="height: 160px; background: #050505; display: flex; align-items: center; justify-content: center; font-family: 'DotGothic16', monospace; font-size: 32px; color: #ffd23f">TOUCHDOWN!</div>
</div>
</div>
<div style="width: 360px; height: 200px; align-self: center; background: repeating-linear-gradient(90deg, #378a3d 0 30px, #3f9a45 30px 60px); border: 3px solid #0a0820"></div>
<div style="margin: 0 12px; height: 300px; background: #efe6cf; border: 9px solid #1d1d22"></div>
</div>

<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(8, 6, 26, 0.78)"></div>

<div role="dialog" aria-modal="true" aria-labelledby="fb-title" style="position: absolute; left: 20px; top: 150px; width: 350px; box-sizing: border-box; background: #1d1d22; border: 3px solid #0a0a10; box-shadow: 6px 6px 0 0 #000; padding: 6px">
<div style="border: 2px dashed #55555f; padding: 6px">
<div style="background: #efe6cf; padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
<h2 id="fb-title" style="margin: 0; font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 16px; line-height: 1.5">HOW ARE YOU LIKING GRIDDION?</h2>
<button type="button" aria-label="Close" onClick="{{close}}" style="flex: none; width: 44px; height: 44px; margin: -10px -10px 0 0; background: transparent; border: none; cursor: pointer; font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 22px; color: #1d1a14">✕</button>
</div>

<sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 0 8px">
<span style="font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 16px; color: #198a4a">THANKS, COACH!</span>
<span style="font-size: 16px; color: #6b6253; text-align: center">Your call has been sent to the booth.</span>
</div>
</sc-if>

<sc-if value="{{notSent}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div role="radiogroup" aria-label="Rating" style="display: flex; justify-content: space-between">
<sc-for list="{{balls}}" as="b" hint-placeholder-count="5">
<button type="button" role="radio" aria-checked="{{b.on}}" aria-label="{{b.label}}" onClick="{{b.pick}}" style="{{b.btn}}">
<span aria-hidden="true" style="position: relative; display: block; width: 33px; height: 21px">
<span style="{{b.sprite}}"></span>
</span>
</button>
</sc-for>
</div>
<span style="font-size: 14px; font-weight: 700; color: #6b6253; text-align: center; letter-spacing: 1px">{{ratingText}}</span>

<label for="fb-msg" style="font-weight: 700; font-size: 13px; letter-spacing: 1px; color: #6b6253">FEEDBACK <span style="font-weight: 400">(optional)</span></label>
<textarea id="fb-msg" rows="4" maxlength="500" placeholder="What should we add or fix?" style="margin-top: -8px; box-sizing: border-box; width: 100%; padding: 10px; resize: none; background: #f8f2e2; border: 2px solid #1d1a14; color: #1d1a14; font-family: 'Courier Prime', monospace; font-size: 16px; line-height: 1.3; outline: none"></textarea>

<button type="button" onClick="{{send}}" style="{{sendStyle}}">SEND</button>
<button type="button" onClick="{{close}}" style="height: 36px; background: transparent; border: none; cursor: pointer; font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 14px; color: #6b6253; text-decoration: underline">No thanks</button>
</div>
</sc-if>

</div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  sprite(on) {
    var map = ['...BBBBB...', '.BBBBBBBBB.', 'BBBWBWBWBBB', 'BBWWWWWWWBB', 'BBBWBWBWBBB', '.BBBBBBBBB.', '...BBBBB...'];
    var outline = ['...OOOOO...', '.OO.....OO.', 'O..L.L.L..O', 'O.LLLLLLL.O', 'O..L.L.L..O', '.OO.....OO.', '...OOOOO...'];
    var pal = on ? { B: '#8a4f22', W: '#f4f4ee' } : { O: '#1d1a14', L: '#b9ad8c' };
    var m = on ? map : outline, p = 3, sh = [];
    for (var r = 0; r < m.length; r++) {
      for (var c = 0; c < m[r].length; c++) {
        var k = m[r].charAt(c);
        if (k !== '.' && pal[k]) sh.push((c * p + p) + 'px ' + (r * p + p) + 'px 0 0 ' + pal[k]);
      }
    }
    return 'position:absolute;left:-3px;top:-3px;width:3px;height:3px;box-shadow:' + sh.join(',');
  }
  renderVals() {
    var self = this, st = this.state || {};
    var rating = st.rating === undefined ? 4 : st.rating;
    var sent = !!st.sent;
    var words = ['Tap a football', 'Fumble', 'Punt', 'First down', 'Big gain', 'Touchdown!'];
    var balls = [1, 2, 3, 4, 5].map(function (n) {
      var on = n <= rating;
      return {
        on: on ? 'true' : 'false',
        label: n + ' of 5',
        pick: function () { self.setState({ rating: n }); },
        sprite: self.sprite(on),
        btn: 'width:56px;height:52px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid ' + (n === rating ? '#1d1a14' : 'transparent') + ';background:' + (n === rating ? '#ffe27a' : 'transparent')
      };
    });
    return {
      balls: balls,
      ratingText: words[rating].toUpperCase(),
      sent: sent,
      notSent: !sent,
      send: function () { if (rating > 0) self.setState({ sent: true }); },
      close: function () { self.setState({ sent: false, rating: 0 }); },
      sendStyle: 'height:52px;border:3px solid #1d1a14;box-shadow:3px 3px 0 0 #1d1a14;font-family:\'Silkscreen\',monospace;font-weight:700;font-size:16px;cursor:pointer;' + (rating > 0 ? 'background:#c8352f;color:#f3ead7' : 'background:#d9cfb6;color:#8a8170;box-shadow:none;cursor:default')
    };
  }
}
</script>
</body>
</html>
