# Griddion API Worker (spec §9): same origin as the game on Cloudflare Pages.
# NOT DEPLOYED. `npm run check` validates this config with `wrangler deploy --dry-run` (no upload).
name = "griddion-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Routes are commented out until launch of the backend, so nothing on griddion.io changes by accident.
# routes = [
#   { pattern = "griddion.io/feedback", zone_name = "griddion.io" },
# ]

[vars]
LAUNCH_DATE = "2026-11-09"                                   # Drive #1 (spec §9)
ALLOWED_ORIGINS = "https://griddion.io,https://www.griddion.io"

[[d1_databases]]
binding = "DB"
database_name = "griddion"
database_id = "REPLACE_WITH_D1_DATABASE_ID"                  # from `wrangler d1 create griddion`
migrations_dir = "migrations"

# Per-client rate limit, counted at the edge (Workers Rate Limiting API). The key is a hash of the
# client IP; it is never written to D1 or logged. period must be 10 or 60 seconds.
[[ratelimits]]
name = "FEEDBACK_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
